name: Publish Docker Image to GHCR
on:
    push:
        branches:
            - main
            - dev
    workflow_dispatch: # permite correr el workflow manualmente desde github actions

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4

            -   name: Set up JDK 21
                uses: actions/setup-java@v4
                with:
                    java-version: '21'
                    distribution: 'temurin'

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v4

            -   name: Run checks (Lint, Tests, Jacoco)
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # para que pueda descargar printscript
                    GITHUB_ACTOR: ${{ github.actor }}
                run: ./gradlew check

    publish:
        needs: check
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write # para que pueda subir imagenes
        outputs:
            image_tag: ${{ steps.image_tag.outputs.tag }}
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4

            -   name: Set up Docker Buildx # por los secrets que se le pasan en el dockerfile
                uses: docker/setup-buildx-action@v3

            -   name: Log in to GitHub Container Registry
                uses: docker/login-action@v3
                with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Extract Docker metadata (Tags & Labels)
                id: meta
                uses: docker/metadata-action@v5
                with:
                    images: ghcr.io/${{ github.repository }}
                    tags: |
                        type=raw,value=dev,enable=${{ github.ref_name == 'dev' }}
                        type=sha,prefix=dev-,enable=${{ github.ref_name == 'dev' }}
                        type=raw,value=prod,enable=${{ github.ref_name == 'main' }}
                        type=sha,prefix=prod-,enable=${{ github.ref_name == 'main' }}
                        type=raw,value=latest,enable=${{ github.ref_name == 'main' }}

            -   name: Extract immutable SHA tag
                id: image_tag
                env:
                    TAGS: ${{ steps.meta.outputs.tags }}
                run: |
                    set -euo pipefail
                    TAG=$(echo "$TAGS" | tr ',' '\n' | sed 's/.*://' | grep -E '^(dev|prod)-' | head -n 1)
                    echo "Resolved immutable tag: $TAG"
                    echo "tag=$TAG" >> "$GITHUB_OUTPUT"

            -   name: Build and push Docker image
                uses: docker/build-push-action@v6
                with:
                    context: .
                    push: true
                    tags: ${{ steps.meta.outputs.tags }}
                    labels: ${{ steps.meta.outputs.labels }}
                    cache-from: type=gha
                    cache-to: type=gha,mode=max
                    secrets: |
                        "gradle_properties=gpr.user=${{ github.actor }}
                        gpr.key=${{ secrets.GITHUB_TOKEN }}"

    deploy:
        needs: publish
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        steps:
            -   name: Trigger infrastructure deploy
                env:
                    GH_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
                    DEPLOY_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
                    IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
                run: |
                    set -euo pipefail
                    echo "Triggering deploy for environment=$DEPLOY_ENV with printscript_tag=$IMAGE_TAG"
                    gh workflow run infra-deploy.yml \
                        --repo Age-Of-PrintScript/infrastructure \
                        --ref "${{ github.ref_name }}" \
                        -f environment="$DEPLOY_ENV" \
                        -f printscript_tag="$IMAGE_TAG"
